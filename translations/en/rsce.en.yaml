rsce:
    field:
        documentationLevel:
            label:              Level
            description:        Section as a large card or subsection as a notice box
            options:
                section:        Section
                subsection:     Subsection

        kissStatus:
            label:              KISS status
            description:        What KISS adds to this element, shown as a badge above the title
            options:
                extended:       Extended
                styled:         Styled
                core:           Core

    layout_showcase:
        label:                  Layout showcase
        description:            The layout fields from the backend with a live preview of the spacing and the content width
        settings:               Layout fields from the backend
        content:                Content

    bundle_versions:
        label:                  Bundle versions
        description:            The installed commit of each Digitale Dinge bundle compared with main on GitHub
        title:                  Installed versions
        bundle:                 Bundle
        installed:              Installed
        remote:                 GitHub main
        status:                 Status
        current:                Up to date
        behind:                 '{1} 1 commit behind main|]1,Inf[ %count% commits behind main'
        unknown:                Unknown

    documentation_card:
        label:                  Documentation card
        description:            Heading of a section or subsection in the documentation
        field:
            topline:
                label:          Topline
                description:    Small line above the title, e.g. origin and element type
            title:
                label:          Title
                description:    The title of the card
            text:
                label:          Text
                description:    The description below the title
            showcaseIcon:
                label:          Icon
                description:    Name of the icon in layout/css/assets/showcase, e.g. headline. Empty shows a placeholder.
