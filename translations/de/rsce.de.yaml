rsce:
    field:
        documentationLevel:
            label:              Ebene
            description:        Abschnitt als große Karte oder Unterabschnitt als Hinweisbox
            options:
                section:        Abschnitt
                subsection:     Unterabschnitt

        kissStatus:
            label:              KISS-Status
            description:        Was KISS bei diesem Element ergänzt, erscheint als Badge über dem Titel
            options:
                extended:       Erweitert
                styled:         Gestylt
                core:           Core

    layout_showcase:
        label:                  Layout-Showcase
        description:            Die Layout-Felder aus dem Backend mit Live-Vorschau der Abstände und der Inhaltsbreite
        settings:               Layout-Felder aus dem Backend
        content:                Inhalt

    bundle_versions:
        label:                  Bundle-Versionen
        description:            Der installierte Commit jedes Digitale-Dinge-Bundles im Vergleich mit main auf GitHub
        title:                  Installierte Versionen
        bundle:                 Bundle
        installed:              Installiert
        remote:                 GitHub main
        status:                 Status
        current:                Aktuell
        behind:                 '{1} 1 Commit hinter main|]1,Inf[ %count% Commits hinter main'
        unknown:                Unbekannt

    documentation_card:
        label:                  Dokumentations-Karte
        description:            Überschrift eines Abschnitts oder Unterabschnitts in der Dokumentation
        field:
            topline:
                label:          Dachzeile
                description:    Kleine Zeile über dem Titel, z. B. Herkunft und Elementtyp
            title:
                label:          Titel
                description:    Der Titel der Karte
            text:
                label:          Text
                description:    Die Beschreibung unter dem Titel
            showcaseIcon:
                label:          Icon
                description:    Name des Icons aus layout/css/assets/showcase, z. B. headline. Leer zeigt einen Platzhalter.
